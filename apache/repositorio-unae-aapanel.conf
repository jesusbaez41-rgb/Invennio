# aaPanel Apache — Repositorio UNAE Análisis en https://169.58.201.84:8478
#
# Este es el Apache REAL del servidor (/www/server/apache, puerto 80).
# El Apache del sistema (/etc/apache2) debe quedar APAGADO: aaPanel es dueño del 80.
#
# Instalación (una sola vez):
#   1. Asegura el Listen (si no existe):
#        grep -q "^Listen 8478" /www/server/apache/conf/httpd.conf \
#          || echo "Listen 8478" >> /www/server/apache/conf/httpd.conf
#   2. Copia este archivo:
#        cp apache/repositorio-unae-aapanel.conf /www/server/panel/vhost/apache/
#   3. Verifica módulos proxy/ssl en el Apache de aaPanel:
#        /www/server/apache/bin/httpd -M 2>/dev/null | grep -iE 'proxy|ssl'
#      (si falta proxy_module/proxy_http_module, avísame y lo habilitamos en su httpd.conf)
#   4. Recarga graceful:
#        /www/server/apache/bin/apachectl -k graceful
#      o: kill -USR1 $(cat /www/server/apache/logs/httpd.pid)
#   5. Abre el puerto:
#        ufw allow 8478/tcp
#
# Certificado autofirmado del sistema (sin dominio no hay certbot).
# El día que tengas dominio: cambia IP->dominio, 8478->443 y usa certbot.

<VirtualHost *:8478>
    ServerName 169.58.201.84

    SSLEngine on
    SSLCertificateFile      /etc/ssl/certs/ssl-cert-snakeoil.pem
    SSLCertificateKeyFile   /etc/ssl/private/ssl-cert-snakeoil.key

    # La app genera URLs https gracias a estas cabeceras
    # (gunicorn ya trae forwarded_allow_ips="*").
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Host "169.58.201.84"
    RequestHeader set X-Forwarded-Port "8478"

    # Subidas grandes (tesis/datasets): sin límite y con timeout generoso.
    LimitRequestBody 0
    ProxyTimeout 300

    ProxyPass / http://127.0.0.1:5000/ retry=0
    ProxyPassReverse / http://127.0.0.1:5000/

    ErrorLog  /www/wwwlogs/repositorio-unae_error.log
    CustomLog /www/wwwlogs/repositorio-unae_access.log combined
</VirtualHost>
