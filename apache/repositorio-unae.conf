# Apache — Repositorio UNAE Análisis (detrás del proxy existente).
#
# 1. Cambia TU-DOMINIO por tu dominio (2 ocurrencias + ServerAlias si aplica).
# 2. Certificado con certbot (el Apache ya lo tiene para otros proyectos):
#      certbot --apache -d TU-DOMINIO
#    o pega tus rutas SSL si ya gestionas certs a mano.
# 3. Activa y recarga:
#      a2enmod proxy proxy_http headers ssl rewrite
#      a2ensite repositorio-unae
#      apachectl configtest && systemctl reload apache2
#
# La app escucha SOLO en 127.0.0.1:5000 (ver compose.prod.yml).

<VirtualHost *:80>
    ServerName TU-DOMINIO
    # HTTP -> HTTPS
    RewriteEngine On
    RewriteRule ^(.*)$ https://%{HTTP_HOST}$1 [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName TU-DOMINIO

    SSLEngine on
    # Si usaste certbot, él rellena estas 3 líneas solo. Si no:
    SSLCertificateFile      /etc/letsencrypt/live/TU-DOMINIO/fullchain.pem
    SSLCertificateKeyFile   /etc/letsencrypt/live/TU-DOMINIO/privkey.pem

    # La app genera URLs https gracias a estas cabeceras
    # (gunicorn ya trae forwarded_allow_ips="*").
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Host "TU-DOMINIO"

    # Subidas grandes (tesis/datasets): sin límite y con timeout generoso.
    LimitRequestBody 0
    ProxyTimeout 300

    ProxyPass / http://127.0.0.1:5000/ retry=0
    ProxyPassReverse / http://127.0.0.1:5000/

    ErrorLog  ${APACHE_LOG_DIR}/repositorio-unae_error.log
    CustomLog ${APACHE_LOG_DIR}/repositorio-unae_access.log combined
</VirtualHost>
