# Apache — Repositorio UNAE Análisis en https://169.58.201.84:8478
#
# 1. Puerto extra (una sola vez):
#      echo "Listen 8478" >> /etc/apache2/ports.conf
# 2. Certificado autofirmado del sistema (sin dominio no hay certbot):
#      (ya existe en Ubuntu: /etc/ssl/certs/ssl-cert-snakeoil.pem)
# 3. Activa y recarga:
#      a2enmod ssl proxy proxy_http headers rewrite
#      a2ensite repositorio-unae
#      apachectl configtest && systemctl reload apache2
#      ufw allow 8478/tcp
#
# La app escucha SOLO en 127.0.0.1:5000 (ver compose.prod.yml).
# El día que tengas dominio: cambia IP->dominio, 8478->443 y usa certbot.

<VirtualHost *:8478>
    ServerName 169.58.201.84

    SSLEngine on
    SSLCertificateFile      /etc/ssl/certs/ssl-cert-snakeoil.pem
    SSLCertificateKeyFile   /etc/ssl/private/ssl-cert-snakeoil.key

    # La app genera URLs https gracias a estas cabeceras
    # (gunicorn ya trae forwarded_allow_ips="*").
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Host "169.58.201.84"
    RequestHeader set X-Forwarded-Port "8478"

    # Subidas grandes (tesis/datasets): sin límite y con timeout generoso.
    LimitRequestBody 0
    ProxyTimeout 300

    ProxyPass / http://127.0.0.1:5000/ retry=0
    ProxyPassReverse / http://127.0.0.1:5000/

    ErrorLog  ${APACHE_LOG_DIR}/repositorio-unae_error.log
    CustomLog ${APACHE_LOG_DIR}/repositorio-unae_access.log combined
</VirtualHost>
