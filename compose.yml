# Envy configuration
x-envy:
  HUGO_TITLE: InvenioRDM Starter
  HUGO_PARAMS_DESCRIPTION: >
    InvenioRDM is the open source turn-key research data management platform,    with detailed documentation available [here](https://inveniordm.docs.cern.ch).   InvenioRDM Starter facilitates deployment and configuration of InvenioRDM,   allowing you to run InvenioRDM on your local computer within 15 min.
  HUGO_LANGUAGE_CODE: en-US
  HUGO_IGNORE_LOGS:
    - warning-goldmark-raw-html
  HUGO_MARKUP_GOLDMARK_UNSAFE: "true"
  HUGO_DEFAULT_CONTENT_LANGUAGE: "en"
  HUGO_DEFAULT_CONTENT_LANGUAGE_IN_SUBDIR: "false"
  HUGO_LANGUAGES: |
    en:
      languageName: English
      weight: 1
# Shared environment variables for web and worker.
# Link: https://inveniordm.docs.cern.ch/operate/customize/i18n-and-l10n/
x-set-base:
  # The Postgres database URI that should be used for the connection.  
  &base
  INVENIO_SQLALCHEMY_DATABASE_URI: "postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-changeme}@${POSTGRES_HOST:-db}:5432/${POSTGRES_DB:-inveniordm}"
  INVENIO_SECRET_KEY: "${INVENIO_SECRET_KEY:-changeme-insecure-local-secret-key}"
  INVENIO_SECURITY_PASSWORD_SALT: "${INVENIO_SECURITY_PASSWORD_SALT:-changeme-insecure-local-salt}"
  # Default locale (language).
  INVENIO_BABEL_DEFAULT_LOCALE: "${INVENIO_BABEL_DEFAULT_LOCALE:-en}"
  INVENIO_ISO639_LANGUAGES: "${INVENIO_ISO639_LANGUAGES:-de,es,fr}"
  # Default time zone.
  INVENIO_BABEL_DEFAULT_TIMEZONE: "${INVENIO_BABEL_DEFAULT_TIMEZONE:-UTC}"
  INVENIO_LOGGING_CONSOLE_LEVEL: "${INVENIO_LOGGING_CONSOLE_LEVEL:-INFO}"
  # List of availablecitation styles.
  INVENIO_RDM_CITATION_STYLES: "${INVENIO_RDM_CITATION_STYLES:-apa,chicago-author-date,harvard-cite-them-right,ieee,vancouver}"
  INVENIO_RDM_CITATION_STYLES_DEFAULT: "${INVENIO_RDM_CITATION_STYLES_DEFAULT:-apa}"
  # Search configuration.
  # Link: https://invenio-search.readthedocs.io/en/latest/configuration.html
  INVENIO_SEARCH_HOSTS: "${INVENIO_SEARCH_HOSTS:-['search:9200']}"
  INVENIO_SEARCH_INDEX_PREFIX: "${INVENIO_SEARCH_INDEX_PREFIX:-invenio-rdm-}"
  # GlitchTip error tracker
  INVENIO_SENTRY_DSN: "${INVENIO_SENTRY_DSN:-}"
# Authentication.
# https://inveniordm.docs.cern.ch/operate/customize/authentication/
x-set-authentication:
  # Default Email visibility value can be set to either 'restricted' or 'public'.
  &authentication
  INVENIO_ACCOUNTS_DEFAULT_USER_VISIBILITY: "${INVENIO_ACCOUNTS_DEFAULT_USER_VISIBILITY:-restricted}"
  # Enable local login.
  INVENIO_ACCOUNTS_LOCAL_LOGIN_ENABLED: "${INVENIO_ACCOUNTS_LOCAL_LOGIN_ENABLED:-True}"
  # Redirect to the only external login service under specific conditions.
  INVENIO_OAUTHCLIENT_AUTO_REDIRECT_TO_EXTERNAL_LOGIN: "${INVENIO_OAUTHCLIENT_AUTO_REDIRECT_TO_EXTERNAL_LOGIN:-False}"
  # OpenID Connect issuer URL for authentication. 
  # Link: https://auth-wiki.logto.io/openid-connect-discovery
  INVENIO_OIDC_ISSUER: "${INVENIO_OIDC_ISSUER:-}"
  INVENIO_OIDC_APP_CREDENTIALS_CONSUMER_KEY: "${INVENIO_OIDC_APP_CREDENTIALS_CONSUMER_KEY:-}"
  INVENIO_OIDC_APP_CREDENTIALS_CONSUMER_SECRET: "${INVENIO_OIDC_APP_CREDENTIALS_CONSUMER_SECRET:-}"

  # Allow users to change their password.
  INVENIO_SECURITY_CHANGEABLE: "${INVENIO_SECURITY_CHANGEABLE:-True}"
  # Require email confirmation for new accounts.
  INVENIO_SECURITY_CONFIRMABLE: "${INVENIO_SECURITY_CONFIRMABLE:-True}"
  # Allow users to login without first confirming their email address.
  INVENIO_SECURITY_LOGIN_WITHOUT_CONFIRMATION: "${INVENIO_SECURITY_LOGIN_WITHOUT_CONFIRMATION:-True}"
  # Allow users to reset their password.
  INVENIO_SECURITY_RECOVERABLE: "${INVENIO_SECURITY_RECOVERABLE:-True}"
  # Allow users to register new accounts.
  # Desactivado: solo el admin crea usuarios desde /admin/users.
  INVENIO_SECURITY_REGISTERABLE: "${INVENIO_SECURITY_REGISTERABLE:-False}"
  # Enable tracking of basic user login statistics.
  INVENIO_SECURITY_TRACKABLE: "${INVENIO_SECURITY_TRACKABLE:-True}"
  # Disable the update of the user profile (email, full name, etc.) when only external authentication is enabled.
  INVENIO_USERPROFILES_READ_ONLY: "${INVENIO_USERPROFILES_READ_ONLY:-True}"
# Redis/Valkey configuration for broker and cache.
x-set-cache:

  # URL to connect to Redis server.
  &cache
  INVENIO_ACCOUNTS_SESSION_REDIS_URL: "${INVENIO_ACCOUNTS_SESSION_REDIS_URL:-redis://cache:6379/0}"
x-set-db: &db
  POSTGRES_HOST: "${POSTGRES_HOST:-db}"
  POSTGRES_DB: "${POSTGRES_DB:-inveniordm}"
  POSTGRES_USER: "${POSTGRES_USER:-postgres}"
  POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-changeme}"
    # DOI registration configuration.
    # Link: https://inveniordm.docs.cern.ch/operate/customize/dois/
x-set-doi: &doi
  INVENIO_DATACITE_DATACENTER_SYMBOL: "${INVENIO_DATACITE_DATACENTER_SYMBOL:-}"
  INVENIO_DATACITE_ENABLED: "${INVENIO_DATACITE_ENABLED:-False}"
  INVENIO_DATACITE_PREFIX: "${INVENIO_DATACITE_PREFIX:-}"
  INVENIO_DATACITE_TEST_MODE: "${INVENIO_DATACITE_TEST_MODE:-False}"
  INVENIO_DATACITE_USERNAME: "${INVENIO_DATACITE_USERNAME:-}"
  INVENIO_RDM_ALLOW_EXTERNAL_DOI_VERSIONING: "${INVENIO_RDM_ALLOW_EXTERNAL_DOI_VERSIONING:-False}"
  INVENIO_RDM_ALLOW_METADATA_ONLY_RECORDS: "${INVENIO_RDM_ALLOW_METADATA_ONLY_RECORDS:-True}"
  INVENIO_RDM_ALLOW_RESTRICTED_RECORDS: "${INVENIO_RDM_ALLOW_RESTRICTED_RECORDS:-True}"
# Email configuration.
# Link: https://inveniordm.docs.cern.ch/operate/customize/emails/
x-set-mail: &mail
  INVENIO_MAIL_SUPPRESS_SEND: "${INVENIO_MAIL_SUPPRESS_SEND:-True}"
  INVENIO_MAIL_SERVER: "${INVENIO_MAIL_SERVER:-127.0.0.1}"
  INVENIO_MAIL_PORT: "${INVENIO_MAIL_PORT:-587}"
  INVENIO_MAIL_USE_TLS: "${INVENIO_MAIL_USE_TLS:-True}"
  INVENIO_MAIL_USE_SSL: "${INVENIO_MAIL_USE_SSL:-False}"
  INVENIO_MAIL_USERNAME: "${INVENIO_MAIL_USERNAME:-info}"
  INVENIO_MAIL_PASSWORD: "${INVENIO_MAIL_PASSWORD:-}"
  INVENIO_ADMIN_EMAIL: "${INVENIO_ADMIN_EMAIL:-info@inveniosoftware.org}"
  INVENIO_SECURITY_EMAIL_SENDER: "${INVENIO_SECURITY_EMAIL_SENDER:-{INVENIO_ADMIN_EMAIL}}"
# S3 compatible storage backend.
# Link: https://inveniordm.docs.cern.ch/operate/customize/file-uploads/s3/
x-set-s3: &s3
  INVENIO_S3_ENDPOINT_URL: "${INVENIO_S3_ENDPOINT_URL:-}"
  INVENIO_S3_BUCKET_NAME: "${INVENIO_S3_BUCKET_NAME:-}"
  INVENIO_S3_ACCESS_KEY_ID: "${INVENIO_S3_ACCESS_KEY_ID:-}"
  INVENIO_S3_SECRET_ACCESS_KEY: "${INVENIO_S3_SECRET_ACCESS_KEY:-}"
  INVENIO_S3_REGION_NAME: "${INVENIO_S3_REGION_NAME:-us-east-1}"
# Opensearch configuration.
# Link: https://docs.opensearch.org/latest/install-and-configure/install-opensearch/docker/
x-set-search: &search
  DISABLE_INSTALL_DEMO_CONFIG: "${DISABLE_INSTALL_DEMO_CONFIG:-true}"
  DISABLE_SECURITY_PLUGIN: "${DISABLE_SECURITY_PLUGIN:-true}"
  # Java configuration. Adjust memory for production service.
  OPENSEARCH_JAVA_OPTS: "${OPENSEARCH_JAVA_OPTS:--Xms512m -Xmx512m}"
  bootstrap.memory_lock: "${BOOTSTRAP_MEMORY_LOCK:-true}"
  # "Run in cluster mode for better performance and resilience.
  discovery.type: "${DISCOVERY_TYPE:-single-node}"
# Web configuration.
# Link: https://inveniordm.docs.cern.ch/operate/customize/look-and-feel/
x-set-web: &web
  INVENIO_SITE_UI_URL: "${INVENIO_SITE_UI_URL:-https://localhost}"
  INVENIO_SITE_API_URL: "${INVENIO_SITE_API_URL:-https://localhost/api}"
  INVENIO_TRUSTED_HOSTS: "${INVENIO_TRUSTED_HOSTS:-['0.0.0.0', 'localhost', '127.0.0.1']}"
  INVENIO_THEME_FRONTPAGE_TITLE: "${INVENIO_THEME_FRONTPAGE_TITLE:-Repositorio UNAE Análisis}"
  INVENIO_THEME_FRONTPAGE_SUBTITLE: "${INVENIO_THEME_FRONTPAGE_SUBTITLE:-Plataforma institucional para preservar, compartir y descubrir la producción académica.}"
  INVENIO_THEME_LOGO: "${INVENIO_THEME_LOGO:-images/logo-unae.svg}"
  INVENIO_THEME_SHOW_FRONTPAGE_INTRO_SECTION: "${INVENIO_THEME_SHOW_FRONTPAGE_INTRO_SECTION:-False}"
  INVENIO_THEME_SITENAME: "${INVENIO_THEME_SITENAME:-Repositorio UNAE Análisis}"
services:
  # Describes the Redis/Valkey cache service configuration.
  cache:
    image: valkey/valkey:7.2.5-bookworm
    command: [ "valkey-server", "--loglevel", "warning" ]
  # Describes the Postgres database service configuration.
  db:
    image: postgres:17.4-bookworm
    environment:
      <<: [ *db ]
    volumes:
      - db-data:/var/lib/postgresql/data

  # Describes the Caddy proxy service configuration.
  # Link: https://docker-compose.de/en/proxy/caddy/
  proxy:
    image: caddy:2.10
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
  # Describes the Opensearch service configuration.
  # Link: https://docs.opensearch.org/latest/install-and-configure/install-opensearch/docker/
  search:
    image: opensearchproject/opensearch:2.18.0
    environment:
      <<: [ *search ]
    volumes:
      - search-data:/usr/share/opensearch/data
  # Describes InvenioRDM web service configuration.
  web:
    image: ghcr.io/front-matter/invenio-rdm-starter:latest
    build:
      context: .
    platform: linux/amd64
    environment:
      <<: [ *base, *cache, *web, *authentication, *mail, *s3 ]
    volumes:
      # Overrides en vivo sin rebuild: plantillas, logo e invenio.cfg
      - ./templates:/opt/invenio/var/instance/templates:ro
      - ./static/images:/opt/invenio/var/instance/static/images:ro
      - ./invenio.cfg:/opt/invenio/var/instance/invenio.cfg:ro
      # Extensión viva UNAE (código + entry points, sin rebuild de imagen)
      - ./docker/live:/opt/unae_live:ro
      - ./docker/live.pth:/opt/invenio/.venv/lib/python3.13/site-packages/unae_live.pth:ro
      # Archivos subidos (comunidades, registros): persisten y con dueño correcto
      - instance-data:/opt/invenio/var/instance/data
  # Describes InvenioRDM worker service configuration.
  worker:
    image: ghcr.io/front-matter/invenio-rdm-starter:latest
    build:
      context: .
    platform: linux/amd64
    command: [ "celery", "-A", "invenio_app.celery", "worker", "--beat", "--schedule=/tmp/celerybeat-schedule", "--events", "--loglevel=WARNING" ]
    environment:
      <<: [ *base, *cache, *doi, *mail, *s3 ]
    volumes:
      - ./templates:/opt/invenio/var/instance/templates:ro
      - ./static/images:/opt/invenio/var/instance/static/images:ro
      - ./invenio.cfg:/opt/invenio/var/instance/invenio.cfg:ro
      - ./docker/live:/opt/unae_live:ro
      - ./docker/live.pth:/opt/invenio/.venv/lib/python3.13/site-packages/unae_live.pth:ro
      - instance-data:/opt/invenio/var/instance/data

volumes:
  db-data:
  search-data:
  caddy-data:
  caddy-config:
  instance-data:
