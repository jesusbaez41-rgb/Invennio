# Nginx — Repositorio UNAE Análisis en https://169.58.201.84:8478
#
# 1. Copia este archivo (una sola vez):
#      cp nginx/repositorio-unae.conf /etc/nginx/sites-available/
#      ln -s /etc/nginx/sites-available/repositorio-unae.conf /etc/nginx/sites-enabled/
# 2. Prueba y recarga:
#      nginx -t && systemctl reload nginx
#      ufw allow 8478/tcp
#
# La app escucha SOLO en 127.0.0.1:5000 (ver compose.prod.yml).
# Certificado autofirmado del sistema (sin dominio no hay certbot).
# El día que tengas dominio: cambia IP->dominio, 8478->443 y usa certbot.

server {
    listen 8478 ssl;
    server_name 169.58.201.84;

    ssl_certificate     /etc/ssl/certs/ssl-cert-snakeoil.pem;
    ssl_certificate_key /etc/ssl/private/ssl-cert-snakeoil.key;

    # Subidas grandes (tesis/datasets): sin límite.
    client_max_body_size 0;
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;

    location / {
        proxy_pass http://127.0.0.1:5000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # La app genera URLs https gracias a estas cabeceras
        # (gunicorn ya trae forwarded_allow_ips="*").
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host 169.58.201.84;
        proxy_set_header X-Forwarded-Port 8478;
    }

    access_log /var/log/nginx/repositorio-unae_access.log;
    error_log  /var/log/nginx/repositorio-unae_error.log;
}
