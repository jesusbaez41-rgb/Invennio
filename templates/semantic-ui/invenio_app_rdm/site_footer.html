{#
   Repositorio UNAE Análisis — barra inferior del pie.
   Créditos institucionales y selector de idioma.
#}

<div class="unae-footer-bottom">
  <div class="ui container unae-footer-bottom-inner">
    <p>
      © 2026 {{ _(config.THEME_SITENAME) }} ·
      {{ _("Ministerio de Salud Pública y Bienestar Social") }}
    </p>
    <div class="unae-footer-meta">
      <a href="https://www.mspbs.gov.py/" target="_blank" rel="noopener noreferrer">mspbs.gov.py</a>
      {% if config.I18N_LANGUAGES %}
      <form class="unae-lang-form" action="{{ url_for('invenio_i18n.set_lang') }}" method="POST">
        <label for="lang-code">{{ _("Idioma") }}</label>
        <select id="lang-code" name="lang_code" aria-label="{{ _('Idioma') }}" onchange="this.form.submit()">
          {% for locale in current_i18n.get_locales() %}
            <option value="{{ locale.language }}"{% if current_i18n.language == locale.language %} selected{% endif %}>{{ locale.get_display_name() }}</option>
          {% endfor %}
        </select>
      </form>
      {% endif %}
    </div>
  </div>
</div>
